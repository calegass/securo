name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect backend-relevant changes
        id: backend-changes
        working-directory: .
        run: |
          set -euo pipefail

          # Keep the required Backend Tests check fast for PRs that only touch
          # frontend/docs files. Pushes to main still run the full backend suite.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(backend/.*|\.github/workflows/ci\.yml)$'; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip backend tests
        if: steps.backend-changes.outputs.run_backend != 'true'
        run: echo "No backend-relevant changes; skipping backend test suite."

      - name: Set up Python
        if: steps.backend-changes.outputs.run_backend == 'true'
        uses: actions/setup-python@v7
        with:
          # Single source of truth with the Docker image: CI must test the
          # same interpreter the backend ships with.
          python-version-file: backend/.python-version
          cache: pip

      - name: Install dependencies
        if: steps.backend-changes.outputs.run_backend == 'true'
        run: |
          # Everything comes from uv.lock: export it (--frozen never touches
          # the lock) and hand it to pip with hash checking, so CI installs
          # exactly the audited versions.
          # renovate: datasource=pypi depName=uv
          pip install -q uv==0.12.5
          uv export --frozen --all-extras --no-emit-project -o /tmp/requirements-dev.txt
          pip install --require-hashes -r /tmp/requirements-dev.txt
          pip install --no-deps -e .

      - name: Verify lockfile is in sync
        if: steps.backend-changes.outputs.run_backend == 'true'
        run: |
          # Fails if pyproject.toml changed without regenerating uv.lock
          # (someone edited deps without running scripts/lock.sh).
          uv lock --check

      - name: Lint with Ruff
        if: steps.backend-changes.outputs.run_backend == 'true'
        run: ruff check .

      - name: Type check with ty
        if: steps.backend-changes.outputs.run_backend == 'true'
        run: ty check .

      - name: Run tests with coverage
        if: steps.backend-changes.outputs.run_backend == 'true'
        run: |
          pytest -n auto --dist loadfile --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage report
        if: ${{ always() && steps.backend-changes.outputs.run_backend == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/coverage.xml

  migration-chain:
    name: Migration Chain
    runs-on: ubuntu-latest

    steps:
      # No `ref:` override, so on a pull request this is the merge with the
      # base branch. That is the whole point: a revision id that only clashes
      # once both sides are together is visible here and nowhere else.
      - uses: actions/checkout@v7

      - name: Check the Alembic revision chain
        run: python3 backend/scripts/check_migration_chain.py

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & Build
        run: npm run build

      - name: Run tests
        run: npm test

  deploy-production:
    name: Deploy to Dokploy
    needs: [backend-tests, migration-chain, frontend-checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DOKPLOY_URL: https://dokploy.calegari.dev.br
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}

    steps:
      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          if [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::error::Configure DOKPLOY_API_KEY and DOKPLOY_COMPOSE_ID in the production environment secrets."
            exit 1
          fi

      - name: Trigger Dokploy deployment
        run: |
          set -euo pipefail

          jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "Deploy ${GITHUB_SHA::7}" \
            --arg description "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            '{composeId: $composeId, title: $title, description: $description}' \
            > "$RUNNER_TEMP/dokploy-payload.json"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --request POST \
            "$DOKPLOY_URL/api/compose.deploy" \
            --header "Content-Type: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "@$RUNNER_TEMP/dokploy-payload.json"

          echo "Deployment accepted by Dokploy." >> "$GITHUB_STEP_SUMMARY"
